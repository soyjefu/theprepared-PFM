{% extends "account/base.html" %}

{% block title %}거래 수정 - PFM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-transparent border-0 pt-4 px-4">
                <h4 class="fw-bold mb-0">거래 수정</h4>
                <p class="text-secondary small mb-0">"{{ transaction.date|date:"Y-m-d" }} - {{ transaction.item }}" 거래 정보를 변경합니다.</p>
            </div>
            <div class="card-body p-4">
                <form method="post" action="?next={{ next }}">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">날짜</label>
                            <input type="date" name="date" class="form-control" value="{{ form.date.value|date:'Y-m-d'|default:form.date.value }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">금액</label>
                            <div class="input-group">
                                <input type="number" name="amount" class="form-control form-control-lg fw-bold" value="{{ form.amount.value|floatformat:0 }}" required>
                                <span class="input-group-text">원</span>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold text-secondary">아이템</label>
                            <input type="text" name="item" class="form-control" value="{{ form.item.value }}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold text-secondary">메모 (선택)</label>
                            <input type="text" name="memo" class="form-control" value="{{ form.memo.value|default:'' }}">
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-primary">차변 (받는 쪽 / 비용 +)</label>
                            <select name="debit_account" class="form-select" required>
                                <option value="">--- 항목 선택 ---</option>
                                {% for type, accounts in debit_accounts.items %}
                                    <optgroup label="{{ type }}">
                                        {% for acc in accounts %}
                                            <option value="{{ acc.id }}" {% if form.debit_account.value|stringformat:"s" == acc.id|stringformat:"s" %}selected{% endif %}>
                                                {% if acc.type == '자산' or acc.type == '비용' %}+{% else %}-{% endif %} {{ acc.name }}
                                            </option>
                                        {% endfor %}
                                    </optgroup>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-danger">대변 (주는 쪽 / 수익 -)</label>
                            <select name="credit_account" class="form-select" required>
                                <option value="">--- 항목 선택 ---</option>
                                {% for type, accounts in credit_accounts.items %}
                                    <optgroup label="{{ type }}">
                                        {% for acc in accounts %}
                                            <option value="{{ acc.id }}" {% if form.credit_account.value|stringformat:"s" == acc.id|stringformat:"s" %}selected{% endif %}>
                                                {% if acc.type == '부채' or acc.type == '수익' or acc.type == '순자산' %}+{% else %}-{% endif %} {{ acc.name }}
                                            </option>
                                        {% endfor %}
                                    </optgroup>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-12">
                            <div class="form-check form-switch p-3 bg-body-tertiary rounded border mt-2">
                                <input class="form-check-input ms-0 me-2" type="checkbox" name="is_repayment" id="id_is_repayment" {% if form.is_repayment.value %}checked{% endif %}>
                                <label class="form-check-label fw-medium" for="id_is_repayment">
                                    부채 상환 거래 (가용 현금에서 제외)
                                </label>
                            </div>
                        </div>

                        <div class="col-12 mt-5 pt-3 border-top d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-5 fw-bold">수정 완료</button>
                            <a href="{{ next }}" class="btn btn-outline-secondary px-4">취소</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
