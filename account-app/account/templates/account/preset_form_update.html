{% extends "account/base.html" %}

{% block title %}프리셋 수정 - PFM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-transparent border-0 pt-4 px-4">
                <h4 class="fw-bold mb-0">거래 프리셋 수정</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">프리셋 이름</label>
                            {{ form.name }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">프리셋 타입</label>
                            {{ form.preset_type }}
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold text-secondary">아이템</label>
                            {{ form.item }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">금액</label>
                            {{ form.amount }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">고정 일자 (1-31)</label>
                            {{ form.day_of_month }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-primary">차변 계정 (+)</label>
                            <select name="debit_account" class="form-select" required>
                                <option value="">--- 항목 선택 ---</option>
                                {% for type, accounts in debit_accounts_grouped.items %}
                                    <optgroup label="{{ type }}">
                                        {% for acc in accounts %}
                                            <option value="{{ acc.id }}" {% if form.debit_account.value|stringformat:"s" == acc.id|stringformat:"s" %}selected{% endif %}>
                                                {% if acc.type == '자산' or acc.type == '비용' %}+{% else %}-{% endif %} {{ acc.name }}
                                            </option>
                                        {% endfor %}
                                    </optgroup>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-danger">대변 계정 (-)</label>
                            <select name="credit_account" class="form-select" required>
                                <option value="">--- 항목 선택 ---</option>
                                {% for type, accounts in credit_accounts_grouped.items %}
                                    <optgroup label="{{ type }}">
                                        {% for acc in accounts %}
                                            <option value="{{ acc.id }}" {% if form.credit_account.value|stringformat:"s" == acc.id|stringformat:"s" %}selected{% endif %}>
                                                {% if acc.type == '부채' or acc.type == '수익' or acc.type == '순자산' %}+{% else %}-{% endif %} {{ acc.name }}
                                            </option>
                                        {% endfor %}
                                    </optgroup>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2 mt-5 pt-3 border-top">
                        <button type="submit" class="btn btn-primary px-4 fw-bold">저장하기</button>
                        <a href="{% url 'account:settings' %}#preset-section" class="btn btn-outline-secondary px-4">취소</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Bootstrap classes
        const selects = document.querySelectorAll('select');
        selects.forEach(s => s.classList.add('form-select'));
        const inputs = document.querySelectorAll('input[type="text"], input[type="number"]');
        inputs.forEach(i => i.classList.add('form-control'));
    });
</script>
{% endblock %}
