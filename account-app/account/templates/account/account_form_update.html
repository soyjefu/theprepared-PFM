{% extends "account/base.html" %}

{% block title %}계정 수정 - PFM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-transparent border-0 pt-4 px-4">
                <h4 class="fw-bold mb-0">계정 항목 수정</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" id="account-update-form">
                    {% csrf_token %}
                    <div class="row g-3">
                        {% for field in form %}
                        <div class="{% if field.name == 'is_active' %}col-12 mt-3{% else %}col-md-6{% endif %}">
                            {% if field.name == 'is_active' %}
                            <div class="form-check form-switch p-3 bg-body-tertiary rounded border">
                                {{ field }}
                                <label class="form-check-label fw-bold ms-2">{{ field.label }}</label>
                            </div>
                            {% else %}
                            <label class="form-label small fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% endif %}
                        </div>
                        {% endfor %}
                    </div>
                    
                    <div class="d-flex gap-2 mt-5">
                        <button type="submit" class="btn btn-primary px-4 fw-bold">저장하기</button>
                        <a href="{% url 'account:settings' %}#account-section" class="btn btn-outline-secondary px-4">취소</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const typeSelect = document.getElementById('id_type');
        const categorySelect = document.getElementById('id_category');

        const categoryOptions = {
            '자산': [
                { value: 'GENERAL', text: '일반' },
                { value: 'VARIABLE', text: '유동' },
                { value: 'SAVING', text: '저축' }
            ],
            '부채': [
                { value: 'GENERAL', text: '일반' },
                { value: 'VARIABLE', text: '유동' }
            ],
            '수익': [
                { value: 'FIXED', text: '고정' },
                { value: 'VARIABLE', text: '유동' }
            ],
            '비용': [
                { value: 'FIXED', text: '고정' },
                { value: 'VARIABLE', text: '유동' }
            ],
            '순자산': [
                { value: 'GENERAL', text: '일반' }
            ]
        };

        function updateCategoryOptions() {
            const selectedType = typeSelect.value;
            const options = categoryOptions[selectedType] || [];
            const currentCategoryValue = categorySelect.value;

            categorySelect.innerHTML = '';
            options.forEach(opt => {
                const optionElement = document.createElement('option');
                optionElement.value = opt.value;
                optionElement.textContent = opt.text;
                if (opt.value === currentCategoryValue) optionElement.selected = true;
                categorySelect.appendChild(optionElement);
            });
        }

        if (typeSelect) {
            typeSelect.addEventListener('change', updateCategoryOptions);
            updateCategoryOptions();
        }

        // Bootstrap classes
        typeSelect.classList.add('form-select');
        categorySelect.classList.add('form-select');
        document.getElementById('id_name').classList.add('form-control');
    });
</script>
{% endblock %}
