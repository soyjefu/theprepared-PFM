{% extends "account/base.html" %}
{% load humanize %}

{% block title %}거래 내역 - PFM{% endblock %}

{% block extra_style %}
<style>
    .table-container {
        border-radius: 10px;
        overflow: hidden;
    }
    .badge-asset { background-color: #8A2BE2; }
    .badge-liability { background-color: #007BA7; }
    .badge-expense { background-color: #dc3545; }
    .badge-income { background-color: #198754; }
    .badge-equity { background-color: #ffc107; color: #000; }
    
    .filter-card {
        border: none;
        background-color: var(--bs-body-tertiary);
    }
    .transaction-row:hover {
        background-color: rgba(var(--bs-primary-rgb), 0.03);
    }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">거래 내역</h2>
    <div>
        <a href="{% url 'account:transaction_create' %}" class="btn btn-primary btn-sm">
            <i class="fa-solid fa-plus me-1"></i>새 거래 추가
        </a>
    </div>
</div>

<!-- 필터 영역 -->
<div class="card filter-card mb-4 shadow-sm">
    <div class="card-body p-4">
        <form method="get" class="row g-3" 
              hx-get="{% url 'account:transaction_list' %}" 
              hx-target="#transaction-table-wrapper" 
              hx-push-url="true"
              hx-indicator=".htmx-indicator">
            <div class="col-md-4">
                <label class="form-label small fw-bold text-secondary">기간 선택</label>
                <div class="input-group input-group-sm">
                    <select name="year" class="form-select">
                        <option value="">연도</option>
                        {% for y in years %}<option value="{{ y }}" {% if filters.year == y %}selected{% endif %}>{{ y }}년</option>{% endfor %}
                    </select>
                    <select name="month" class="form-select">
                        <option value="">월</option>
                        {% for m in months %}<option value="{{ m }}" {% if filters.month == m %}selected{% endif %}>{{ m }}월</option>{% endfor %}
                    </select>
                </div>
            </div>
            <div class="col-md-5">
                <label class="form-label small fw-bold text-secondary">직접 입력</label>
                <div class="input-group input-group-sm">
                    <input type="date" name="start_date" class="form-control" value="{{ filters.start_date }}">
                    <span class="input-group-text">~</span>
                    <input type="date" name="end_date" class="form-control" value="{{ filters.end_date }}">
                </div>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold text-secondary">계정 선택</label>
                <select name="account" id="account-select" class="form-select form-select-sm">
                    <option value="">전체 계정</option>
                    {% for acc in all_accounts %}
                        <option value="{{ acc.id }}" {% if filters.account == acc.id|stringformat:"s" %}selected{% endif %}>{{ acc.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <input type="text" name="item" class="form-control form-control-sm" placeholder="아이템 검색" value="{{ filters.item }}">
            </div>
            <div class="col-md-4">
                <input type="text" name="memo" class="form-control form-control-sm" placeholder="메모 검색" value="{{ filters.memo }}">
            </div>
            <div class="col-md-4 d-flex gap-2 align-items-center">
                <button type="submit" class="btn btn-dark btn-sm flex-grow-1">
                    <i class="fa-solid fa-search me-1"></i>검색
                </button>
                <div class="htmx-indicator spinner-border spinner-border-sm text-primary ms-1" style="display:none;" role="status"></div>
                <a href="{% url 'account:transaction_list' %}" class="btn btn-outline-secondary btn-sm">
                    <i class="fa-solid fa-rotate me-1"></i>초기화
                </a>
                <button type="button" class="btn btn-outline-info btn-sm" onclick="toggleSplitSearch()">
                    <i class="fa-solid fa-columns me-1"></i>상세
                </button>
            </div>

            <!-- 상세 검색 (숨김 영역) -->
            <div id="split-accounts" class="col-12 mt-3 p-3 bg-body rounded border border-info-subtle" style="display: none;">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">차변(받는 쪽)</label>
                        <select name="debit_account" class="form-select form-select-sm">
                            <option value="">-- 차변 항목 선택 --</option>
                            {% for acc in all_accounts %}<option value="{{ acc.id }}" {% if filters.debit_account == acc.id|stringformat:"s" %}selected{% endif %}>{{ acc.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">대변(주는 쪽)</label>
                        <select name="credit_account" class="form-select form-select-sm">
                            <option value="">-- 대변 항목 선택 --</option>
                            {% for acc in all_accounts %}<option value="{{ acc.id }}" {% if filters.credit_account == acc.id|stringformat:"s" %}selected{% endif %}>{{ acc.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <small class="text-info"><i class="fa-solid fa-circle-info me-1"></i>상세 검색 시 위쪽의 '전체 계정' 필터는 무시됩니다.</small>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<div id="transaction-table-wrapper">
    {% include "account/partials/transaction_table.html" %}
</div>

<style>
    .htmx-indicator.htmx-request {
        display: inline-block !important;
    }
</style>

<script>
function toggleSplitSearch() {
    const splitDiv = document.getElementById('split-accounts');
    const mainSelect = document.getElementById('account-select');
    if (splitDiv.style.display === 'none') {
        splitDiv.style.display = 'block';
        mainSelect.disabled = true;
    } else {
        splitDiv.style.display = 'none';
        mainSelect.disabled = false;
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const debitFilter = "{{ filters.debit_account }}";
    const creditFilter = "{{ filters.credit_account }}";
    if (debitFilter || creditFilter) {
        document.getElementById('split-accounts').style.display = 'block';
        document.getElementById('account-select').disabled = true;
    }
});
</script>
{% endblock %}
